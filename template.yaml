AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hello World Express API on Lambda + API Gateway with CloudWatch monitoring

Parameters:
  AlarmEmail:
    Type: String
    Default: ''
    Description: Email for alarm notifications (optional)

Conditions:
  HasEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/lambda.handler
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 30

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","userAgent":"$context.identity.userAgent"}'
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  AlarmTopic:
    Type: AWS::SNS::Topic

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API returned 5xx errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API p95 latency above 1s
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{
              "title":"Request rate (count / min)","region":"${AWS::Region}","stat":"Sum","period":60,
              "metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApi}"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{
              "title":"Errors (4xx / 5xx)","region":"${AWS::Region}","stat":"Sum","period":60,
              "metrics":[["AWS/ApiGateway","4xx","ApiId","${HttpApi}"],[".","5xx",".","."]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{
              "title":"API latency","region":"${AWS::Region}","period":60,
              "metrics":[["AWS/ApiGateway","Latency","ApiId","${HttpApi}",{"stat":"p50"}],["...",{"stat":"p95"}],["...",{"stat":"p99"}]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{
              "title":"Lambda invocations / errors / duration","region":"${AWS::Region}","period":60,
              "metrics":[["AWS/Lambda","Invocations","FunctionName","${ApiFunction}",{"stat":"Sum"}],[".","Errors",".",".",{"stat":"Sum"}],[".","Duration",".",".",{"stat":"Average","yAxis":"right"}]]}},
            {"type":"log","x":0,"y":12,"width":24,"height":6,"properties":{
              "title":"Recent API requests","region":"${AWS::Region}","view":"table",
              "query":"SOURCE '${ApiAccessLogGroup}' | fields @timestamp, method, path, status, latency | sort @timestamp desc | limit 50"}}
          ]
        }

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-dashboard
