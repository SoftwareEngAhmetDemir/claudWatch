# One-time setup: lets GitHub Actions in your repo deploy to this AWS account without stored keys.
# Deploy once:
#   aws cloudformation deploy --template-file bootstrap/github-oidc.yaml \
#     --stack-name claudwatch-github-oidc --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubRepo=<owner>/<repo>
# (If your account already has the GitHub OIDC provider, pass CreateProvider=false.)
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo allowed to deploy
  CreateProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, 'true']

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: claudwatch-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      # Broad for simplicity (SAM creates IAM roles, Lambda, API GW, alarms, dashboards).
      # Tighten before using for anything beyond this demo.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Description: Save as GitHub secret AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
