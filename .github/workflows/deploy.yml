name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: claudwatch-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS_ROLE_ARN secret
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Secret AWS_ROLE_ARN is not set. See README 'Deploy (CI/CD)'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - run: sam build

      - name: Deploy
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          ARGS=()
          if [ -n "$ALARM_EMAIL" ]; then
            ARGS=(--parameter-overrides "AlarmEmail=$ALARM_EMAIL")
          fi
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            "${ARGS[@]}"

      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: $URL"
          curl -fsS "$URL"
